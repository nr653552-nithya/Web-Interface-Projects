<!DOCTYPE html>
<html>
<head>
    <title>Student Profile Card</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Student Profile Card</h1>

    <div class="box">

        <input type="text" id="name" placeholder="Enter Name"><br>

        <input type="text" id="roll" placeholder="Enter Roll No"><br>

        <input type="number" id="marks" placeholder="Enter Marks"><br>

        <button onclick="show()">Display</button>

    </div>

    <div id="card">

        <h2>Student Profile</h2>

        <p>Name : <span id="sname"></span></p>

        <p>Roll No : <span id="sroll"></span></p>

        <p>Marks : <span id="smarks"></span></p>

        <p>Grade : <span id="sgrade"></span></p>

    </div>

    <script src="script.js"></script>

</body>
<style>
    body{
    font-family: Arial;
    text-align: center;
    background: linear-gradient(to right, #74ebd5, #ACB6E5);
}
.box{
    width:300px;
    margin:auto;
    background: linear-gradient(to bottom, #ffffff, #f1f1f1);
    padding:20px;
    border-radius:10px;
    box-shadow:0 4px 10px rgb(239, 150, 150);
}

input{
    width:90%;
    padding:10px;
    margin:10px;
}

button{
    padding:10px 20px;
    background: linear-gradient(to right, blue, purple);
    color:white;
    border:none;
    cursor:pointer;
}

button:hover{
    background:darkblue;
}

#card{
    display:none;
    width:300px;
    margin:20px auto;
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow: 0px 4px 10px rgb(223, 134, 186);
}
</style>
<script>
    function show(){

    let name = document.getElementById("name").value;
    let roll = document.getElementById("roll").value;
    let marks = document.getElementById("marks").value;

    // Validation
    if(marks < 0 || marks > 100){
        alert("Invalid Marks");
        return;
    }

    let grade;

    if(marks >= 90){
        grade = "A+";
    }
    else if(marks >= 75){
        grade = "A";
    }
    else if(marks >= 60){
        grade = "B";
    }
    else{
        grade = "Fail";
    }

    document.getElementById("sname").innerHTML = name;
    document.getElementById("sroll").innerHTML = roll;
    document.getElementById("smarks").innerHTML = marks;
    document.getElementById("sgrade").innerHTML = grade;

    document.getElementById("card").style.display = "block";
}
</script>
</html>
